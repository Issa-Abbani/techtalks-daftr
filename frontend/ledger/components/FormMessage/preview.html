<!-- @dsCard group="Feedback" height=250 subtitle="Result of a form submit: error or success" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form message</title>
</head>
<body>

<div class="dz pv">
  <div class="pv-col" style="width:342px">
    <span class="pv-cap">Error (role=alert)</span>
    <div class="dz-msg dz-msg--error" role="alert"><svg class="dz-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg><span>Email or password is wrong. Try again, or reset your password.</span></div>
    <div class="dz-msg dz-msg--error" role="alert"><svg class="dz-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg><span>No connection. Check your internet and try again. Nothing was lost.</span></div>
  </div>
  <div class="pv-col" style="width:342px">
    <span class="pv-cap">Success (role=status)</span>
    <div class="dz-msg dz-msg--success" role="status"><svg class="dz-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><span>Reset link sent. Check your email, including the spam folder.</span></div>
    <div class="dz-msg dz-msg--success" role="status"><svg class="dz-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><span><strong>Email verified.</strong> Your shop is ready.</span></div>
  </div>
</div>
</body>
</html>
