<!-- @dsCard group="Data display" height=300 subtitle="Icon + word, never colour alone" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status badge</title>
</head>
<body>

<div class="dz pv">
  <div class="pv-col"><span class="pv-cap">The four states</span>
    <div class="pv-row"><span class="dz-badge dz-badge--healthy"><svg class="dz-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>Healthy</span><span class="dz-badge dz-badge--low"><svg class="dz-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>Low stock</span><span class="dz-badge dz-badge--out"><svg class="dz-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>Out of stock</span><span class="dz-badge dz-badge--expired"><svg class="dz-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m14 14-4 4"/><path d="m10 14 4 4"/></svg>Expired</span></div>
  </div>
  <div class="pv-col" style="width:358px"><span class="pv-cap">In a product row (Buzzy Beans, sample data)</span>
    <div class="dz-card" style="gap:0">
      <div class="dz-prow"><div><div class="dz-prow__name">Espresso Beans</div><div class="dz-prow__meta dz-num">12 kg, reorder at 5</div></div><span class="dz-badge dz-badge--healthy"><svg class="dz-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>Healthy</span></div>
      <div class="dz-prow"><div><div class="dz-prow__name">Oat Milk</div><div class="dz-prow__meta dz-num">3 cartons, reorder at 6</div></div><span class="dz-badge dz-badge--low"><svg class="dz-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>Low stock</span></div>
      <div class="dz-prow"><div><div class="dz-prow__name">Paper Cups</div><div class="dz-prow__meta dz-num">200 pcs</div></div><span class="dz-badge dz-badge--healthy"><svg class="dz-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>Healthy</span></div>
    </div>
  </div>
</div>
</body>
</html>
