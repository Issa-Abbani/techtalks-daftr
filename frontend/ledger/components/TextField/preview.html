<!-- @dsCard group="Forms" height=560 subtitle="Label, hint, error, password with Show/Hide" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text field</title>
</head>
<body>

<div class="dz pv">
  <div class="pv-col" style="width:342px;gap:var(--space-4)">
    <span class="pv-cap">Default and hint</span>
    <div class="dz-field"><label class="dz-label" for="e1">Email</label>
      <input class="dz-input" id="e1" type="email" autocomplete="email" inputmode="email" placeholder="you@yourshop.com"></div>
    <div class="dz-field"><label class="dz-label" for="o1">Business name</label>
      <input class="dz-input" id="o1" type="text" autocomplete="organization" aria-describedby="o1h" value="Buzzy Beans">
      <span class="dz-hint" id="o1h">The name your customers know.</span></div>
    <span class="pv-cap">Focused</span>
    <div class="dz-field"><label class="dz-label" for="f1">Email</label>
      <input class="dz-input is-focus" id="f1" type="email" value="hello@buzzybeans.com"></div>
  </div>
  <div class="pv-col" style="width:342px;gap:var(--space-4)">
    <span class="pv-cap">Error (icon + message)</span>
    <div class="dz-field"><label class="dz-label" for="e2">Email</label>
      <input class="dz-input" id="e2" type="email" value="hello@buzzybeans" aria-invalid="true" aria-describedby="e2e">
      <span class="dz-error" id="e2e"><svg class="dz-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg><span>Check your email. It should look like name@example.com.</span></span></div>
    <span class="pv-cap">Password with Show / Hide (try it)</span>
    <div class="dz-field"><label class="dz-label" for="p1">Password</label>
      <div class="dz-pass"><input class="dz-input" id="p1" type="password" autocomplete="new-password" value="beans2026" aria-describedby="p1h">
      <button class="dz-reveal" type="button" aria-controls="p1" aria-pressed="false"><svg class="dz-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg><span>Show</span></button></div>
      <span class="dz-hint" id="p1h">At least 8 characters.</span></div>
    <span class="pv-cap">Disabled</span>
    <div class="dz-field"><label class="dz-label" for="d1">Email</label>
      <input class="dz-input" id="d1" type="email" value="hello@buzzybeans.com" disabled></div>
  </div>
</div>
<script>

var eye='<svg class="dz-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>', off='<svg class="dz-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';
document.querySelectorAll('.dz-reveal').forEach(function(btn){btn.addEventListener('click',function(){
var i=document.getElementById(btn.getAttribute('aria-controls'));var show=i.type==='password';i.type=show?'text':'password';
btn.setAttribute('aria-pressed',show?'true':'false');btn.innerHTML=(show?off:eye)+'<span>'+(show?'Hide':'Show')+'</span>';});});
</script>
</body>
</html>
