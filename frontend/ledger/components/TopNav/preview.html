<script>

document.querySelectorAll('.dz-nav__toggle').forEach(function(t){var sheet=document.getElementById(t.getAttribute('aria-controls'));
function set(o){t.setAttribute('aria-expanded',o);t.setAttribute('aria-label',o?'Close menu':'Open menu');t.innerHTML=o?X:M;sheet.hidden=!o;}
t.addEventListener('click',function(){set(t.getAttribute('aria-expanded')!=='true');});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&t.getAttribute('aria-expanded')==='true'){set(false);t.focus();}});});
