<!-- @dsCard group="Forms" height=560 subtitle="Verify email: six boxes, paste-friendly" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6-digit code</title>
</head>
<body>

<div class="dz pv">
  <div class="pv-phone"><div class="pv-pad" style="gap:var(--space-6)">
    <a class="dz-logo dz-logo--lg" href="#" aria-label="Daftr home"><span class="dz-logo__mark"><svg class="dz-ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6z"/><path d="M10 8h5M10 12h5M10 16h3"/></svg></span><span class="dz-logo__word">Daftr</span></a>
    <div style="display:flex;flex-direction:column;gap:var(--space-2)">
      <h1 class="text-heading">Check your email</h1>
      <p class="text-body" style="color:var(--muted)">Enter the 6-digit code we sent to <strong style="color:var(--ink)">hello@buzzybeans.com</strong>.</p>
    </div>
    <fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-2)">
      <legend class="dz-label" style="padding:0;margin-bottom:var(--space-2)">Verification code</legend>
      <div class="dz-code" id="code"><input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 1 of 6" autocomplete="one-time-code"><input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2 of 6"><input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3 of 6"><input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4 of 6"><input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 5 of 6"><input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 6 of 6"></div>
    </fieldset>
    <button class="dz-btn dz-btn--primary dz-btn--block" type="button">Verify email</button>
    <p class="text-small" style="color:var(--muted)">No email? Check spam, or <a class="dz-link dz-link--inline" href="#">send a new code</a>.</p>
  </div></div>
  <div class="pv-col" style="width:342px">
    <span class="pv-cap">Error</span>
    <div class="dz-code" aria-invalid="true" aria-describedby="ce"><input type="text" inputmode="numeric" maxlength="1" value="4" aria-label="Digit 1 of 6"><input type="text" inputmode="numeric" maxlength="1" value="8" aria-label="Digit 2 of 6"><input type="text" inputmode="numeric" maxlength="1" value="2" aria-label="Digit 3 of 6"><input type="text" inputmode="numeric" maxlength="1" value="1" aria-label="Digit 4 of 6"><input type="text" inputmode="numeric" maxlength="1" value="9" aria-label="Digit 5 of 6"><input type="text" inputmode="numeric" maxlength="1" value="3" aria-label="Digit 6 of 6"></div>
    <span class="dz-error" id="ce"><svg class="dz-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg><span>That code doesn't match. Check the latest email from Daftr and try again.</span></span>
    <span class="pv-cap" style="margin-top:var(--space-4)">Type or paste 6 digits in the phone frame</span>
  </div>
</div>
<script>

var ins=[].slice.call(document.querySelectorAll('#code input'));
ins.forEach(function(inp,i){
 inp.addEventListener('input',function(){var v=inp.value.replace(/\D/g,'');
  if(v.length>1){v.split('').slice(0,6-i).forEach(function(d,k){ins[i+k].value=d;});(ins[Math.min(i+v.length,5)]).focus();return;}
  inp.value=v;if(v&&i<5)ins[i+1].focus();});
 inp.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!inp.value&&i>0){ins[i-1].focus();ins[i-1].value='';e.preventDefault();}
  if(e.key==='ArrowLeft'&&i>0)ins[i-1].focus();if(e.key==='ArrowRight'&&i<5)ins[i+1].focus();});
 inp.addEventListener('paste',function(e){var t=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
  if(!t)return;e.preventDefault();t.split('').forEach(function(d,k){if(ins[k])ins[k].value=d;});ins[Math.min(t.length,5)].focus();});
});
</script>
</body>
</html>
