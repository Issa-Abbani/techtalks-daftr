<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert</title>
</head>
<body>

<div class="dz pv">
  <div class="pv-col" style="width:358px">
    <div class="dz-alert dz-alert--info" role="status"><svg class="dz-ic lead" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><div class="dz-alert__body"><span class="dz-alert__title">Verify your email</span><span class="dz-alert__text">We sent a 6-digit code to hello@buzzybeans.com.</span><a class="dz-link" href="#">Enter code</a></div><button class="dz-iconbtn" type="button" aria-label="Dismiss"><svg class="dz-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <div class="dz-alert dz-alert--warning" role="status"><svg class="dz-ic lead" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><div class="dz-alert__body"><span class="dz-alert__title">Oat Milk is running low</span><span class="dz-alert__text">3 cartons left. You reorder at 6.</span><a class="dz-link" href="#">View product</a></div><button class="dz-iconbtn" type="button" aria-label="Dismiss"><svg class="dz-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
  </div>
  <div class="pv-col" style="width:358px">
    <div class="dz-alert dz-alert--danger" role="alert"><svg class="dz-ic lead" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg><div class="dz-alert__body"><span class="dz-alert__title">Changes not saved</span><span class="dz-alert__text">Check your internet connection and try again.</span><a class="dz-link" href="#">Try again</a></div><button class="dz-iconbtn" type="button" aria-label="Dismiss"><svg class="dz-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <div class="dz-alert dz-alert--success" role="status"><svg class="dz-ic lead" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><div class="dz-alert__body"><span class="dz-alert__title">Stock updated</span><span class="dz-alert__text">Espresso Beans is now 12 kg.</span></div><button class="dz-iconbtn" type="button" aria-label="Dismiss"><svg class="dz-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
  </div>
</div>

</html>
