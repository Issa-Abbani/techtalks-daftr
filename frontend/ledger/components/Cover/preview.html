<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daftr</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--canvas); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .brand { fill: var(--primary); }
  .deep-brand { fill: var(--primary-hover); }
  .ink { fill: var(--ink); }
  .signal { fill: var(--warning); }
  .card { rx: var(--radius-card); }
  .tag { rx: 12px; }
  .rule { stroke: var(--border-strong); stroke-width: 1; }
  .margin { stroke: var(--primary); stroke-width: 2; }
  .words { position: absolute; left: var(--space-8); bottom: var(--space-8); max-width: 440px; }
  .name { margin: 0; font-size: 112px; line-height: .92; font-weight: 600; letter-spacing: -0.03em; color: var(--ink); }
  .tagline { margin: var(--space-3) 0 0 6px; font-size: 14px; line-height: 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      primary 160x224 (the brand, largest) · primary-hover 112x160 · ink 144x192 · warning 64x24 once (it only ever means low stock) — about 30% of 960x288
  arrangement ledger columns standing on one baseline space-8 above the bottom edge, space-4 gutters, heights stepped like a column of figures
  pattern     a few ledger hairlines, from "borders, not shadows" and the notebook name: four border-strong rules at a space-8 pitch crossing the columns, plus one primary margin line
  scales      sides in space-4 multiples; gutters space-4; rule pitch space-8; corners radius-card; tag rx is half its 24px height
-->
<rect class="brand card" x="16" y="32" width="160" height="224" rx="12"/>
<rect class="deep-brand card" x="192" y="96" width="112" height="160" rx="12"/>
<rect class="signal tag" x="192" y="56" width="64" height="24" rx="12"/>
<rect class="ink card" x="320" y="64" width="144" height="192" rx="12"/>
<line class="rule" x1="0" y1="128.5" x2="480" y2="128.5"/>
<line class="rule" x1="0" y1="160.5" x2="480" y2="160.5"/>
<line class="rule" x1="0" y1="192.5" x2="480" y2="192.5"/>
<line class="rule" x1="0" y1="224.5" x2="480" y2="224.5"/>
<line class="margin" x1="40" y1="0" x2="40" y2="288"/>
</svg>
</div>
<div class="words">
<h1 class="name">Daftr</h1>
<p class="tagline">Know what is on your shelves.</p>
</div>
</div>
</body>
</html>
